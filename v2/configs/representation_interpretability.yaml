  clip:
    display_name: Original CLIP ViT-B/16
    source_cache: v2/cache/clip/test.pt
    sultana_cache: v2/cache/experiment_013_cross_domain/clip_linear_probe_external.pt
    fruitvision_cache: v2/cache/experiment_014_multi_domain/clip_linear_probe_fruitvision.pt
    embedding_dim: 512
